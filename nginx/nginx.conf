worker_processes auto;
events { worker_connections 1024; }

http {
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               'EECDH+AESGCM:EDH+AESGCM';
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=sensitive:10m rate=5r/m;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  example.ru www.example.ru api.example.ru;

        return 301 https://$host$request_uri;
    }

    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  example.ru www.example.ru;

        ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

        location / {
            proxy_pass           http://client:3000;
            proxy_set_header     Host               $host;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $remote_addr;
            proxy_set_header     X-Forwarded-Proto  $scheme;
        }

        access_log  /var/log/nginx/access-client.log  main;
        error_log   /var/log/nginx/error-client.log   warn;
    }

    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  api.example.ru;

        ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

        location / {
            proxy_pass           http://server:8000;
            proxy_set_header     Host               $host;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $remote_addr;
            proxy_set_header     X-Forwarded-Proto  $scheme;
            limit_req zone=api_global burst=20 nodelay;
        }

        location ~ ^/auth/(login/|password/reset/|register/|email/confirm/|code/resend/) {
            proxy_pass           http://server:8000;
            proxy_set_header     Host               $host;
            proxy_set_header     X-Real-IP          $remote_addr;
            proxy_set_header     X-Forwarded-For    $remote_addr;
            proxy_set_header     X-Forwarded-Proto  $scheme;
            limit_req zone=sensitive burst=5 nodelay;
        }

        location /static/ {
            alias /app/static/;
            try_files $uri $uri/ =404;
        }

        access_log  /var/log/nginx/access-api.log  main;
        error_log   /var/log/nginx/error-api.log   warn;
    }
}
